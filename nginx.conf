worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 300M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Nginx Proxy Cache for Comic Images (10GB disk cache, 100MB RAM metadata)
    proxy_cache_path /tmp/nginx_img_cache levels=1:2 keys_zone=img_cache:100m max_size=10g inactive=30d use_temp_path=off;

    # Rate Limiting Zones (Anti-Scraper & DDoS Mitigation)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=read_limit:10m rate=20r/s;
    limit_req_status 429;

    # Bad Bot & Scraper User-Agent Blocker Map
    map $http_user_agent $bad_bot {
        default 0;
        ~*(?i)(scrapy|python-requests|bytespider|wget|sqlmap|nikto|masscan|httpx|postmanruntime|aiohttp|urllib) 1;
    }

    # Cloudflare / Reverse Proxy HTTPS Protocol Forwarding
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream api_backend {
        server api:5000;
        keepalive 64;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _ localhost truyenkomi.com www.truyenkomi.com truyenkomi.site www.truyenkomi.site hypermmo.site www.hypermmo.site;

        # Referrer Policy: Cho phép tải ảnh trực tiếp từ CDN MangaDex không bị chặn hotlink
        add_header Referrer-Policy "no-referrer" always;

        # Block Known Malicious Bot Scrapers
        if ($bad_bot = 1) {
            return 403 '{"status": 403, "error": "Forbidden", "message": "Truy cập bị từ chối do phát hiện công cụ cào tự động."}';
        }

        # Gzip compression for faster loading
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

        # Exact match prevents the chapter API regex from bypassing image caching.
        location = /api/chapters/proxy-image {
            proxy_cache img_cache;
            proxy_cache_key "$scheme$request_method$request_uri";
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 30s;
            proxy_cache_lock_age 30s;
            proxy_cache_revalidate on;

            add_header X-Cache-Status $upstream_cache_status always;
            # Preserve the API's success-only Cache-Control; never cache errors for a year.
            add_header Referrer-Policy "no-referrer" always;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering on;
            proxy_buffers 16 64k;
            proxy_busy_buffers_size 128k;
        }

        # 2. Rate Limiting for Chapter Reading API metadata
        location ~ ^/api/(chapters|comics/.+/chapters) {
            limit_req zone=read_limit burst=30 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # SEO Sitemap & Robots.txt Direct Routing
        location = /sitemap.xml {
            proxy_pass http://api_backend/api/seo/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /robots.txt {
            proxy_pass http://api_backend/api/seo/robots.txt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Swagger Documentation
        location /swagger/ {
            proxy_pass http://api_backend/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Health Check Endpoint
        location /health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rate Limiting for General API
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Static Assets Caching (JS, CSS, Fonts, Images)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp|avif)$ {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Angular Frontend SPA Routing (Fallback)
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
