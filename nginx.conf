events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Caching zone for Edge Static Assets
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC_CACHE:10m max_size=1g inactive=7d use_temp_path=off;

    upstream api_backend {
        server backend:5000;
    }

    upstream minio_storage {
        server minio:9000;
    }

    server {
        listen 80;
        server_name localhost;

        # Gzip compression for faster loading
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

        # Proxy API
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # MinIO Storage CDN Cache
        location /comics/ {
            proxy_pass http://minio_storage;
            proxy_set_header Host $host;
            proxy_cache STATIC_CACHE;
            proxy_cache_valid 200 302 365d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Browser Cache Control Header
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
