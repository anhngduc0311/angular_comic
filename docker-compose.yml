version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: mangaflux-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: mangaflux-minio
    environment:
      MINIO_ROOT_USER: "mangaflux_admin"
      MINIO_ROOT_PASSWORD: "MangaFluxSecretPassword2026!"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    volumes:
      - minio_data:/data

volumes:
  redis_data:
  minio_data:
