version: '3.8'

services:
  # 1. Database - SQL Server
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: truyenkomi-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TruyenKomiDbPassword2026!
      - MSSQL_PID=Developer
    restart: always
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/database:ro

  # 2. Cache - Redis
  redis:
    image: redis:7-alpine
    container_name: truyenkomi-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  # 3. Object Storage - MinIO
  minio:
    image: minio/minio:latest
    container_name: truyenkomi-minio
    environment:
      MINIO_ROOT_USER: "truyenkomi_admin"
      MINIO_ROOT_PASSWORD: "TruyenKomiSecretPassword2026!"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    volumes:
      - minio_data:/data

  # 4. Search Engine - Meilisearch
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: truyenkomi-meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=TruyenKomiMeiliMasterKey2026!
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    restart: always
    volumes:
      - meili_data:/meili_data

  # 5. Backend .NET Web API
  api:
    build:
      context: ./backend/MangaFlux.API
      dockerfile: Dockerfile
    container_name: truyenkomi-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_CONNECTION_STRING=Server=sqlserver,1433;Database=TruyenKomiDb;User Id=sa;Password=TruyenKomiDbPassword2026!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - REDIS_CONNECTION_STRING=redis:6379,abortConnect=false
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=TruyenKomiMeiliMasterKey2026!
      - JWT_SECRET=${JWT_SECRET:-TruyenKomiSecretKeyForJwtTokenGeneration2026SuperSecure!}
      - JWT_ISSUER=${JWT_ISSUER:-TruyenKomiAPI}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-TruyenKomiClient}
      - JWT_EXPIRY_DAYS=${JWT_EXPIRY_DAYS:-7}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-510177815251-88f3mqoiatfct4jj0bhnuhmol985ae0s.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - R2_ENDPOINT=${R2_ENDPOINT:-storage.googleapis.com}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY:-GOOGQHRXVRS7YCR24JBLB33S}
      - R2_SECRET_KEY=${R2_SECRET_KEY:-3Iamo8whmuUeT2B+CMtRnfW6qdIsmwXVec47tF52}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-truyenkomi}
      - R2_SECURE=${R2_SECURE:-true}
      - R2_CDN_BASE_URL=${R2_CDN_BASE_URL:-https://img.truyenkomi.site}
    depends_on:
      - sqlserver
      - redis
      - meilisearch

  # 6. Frontend Angular SPA
  frontend:
    build:
      context: ./angular
      dockerfile: Dockerfile
    container_name: truyenkomi-frontend
    restart: always
    ports:
      - "4200:80"

  # 7. Gateway / Reverse Proxy - Nginx
  nginx:
    image: nginx:alpine
    container_name: truyenkomi-nginx
    ports:
      - "80:80"
      - "8080:80"
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
      - redis
      - minio

  # 8. Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: truyenkomi-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  # 9. Monitoring - Grafana
  grafana:
    image: grafana/grafana:11.2.0
    container_name: truyenkomi-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  sqlserver_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  meili_data:
