version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: truyenkomi-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TruyenKomiDbPassword2026!
      - MSSQL_PID=Developer
    restart: always
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/database:ro

  redis:
    image: redis:7-alpine
    container_name: truyenkomi-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: truyenkomi-minio
    environment:
      MINIO_ROOT_USER: "truyenkomi_admin"
      MINIO_ROOT_PASSWORD: "TruyenKomiSecretPassword2026!"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    volumes:
      - minio_data:/data

  nginx:
    image: nginx:alpine
    container_name: truyenkomi-nginx
    ports:
      - "8080:80"
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - minio

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: truyenkomi-cloudflared
    profiles: ["tunnel"]
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: truyenkomi-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: truyenkomi-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: truyenkomi-meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=TruyenKomiMeiliMasterKey2026!
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    restart: always
    volumes:
      - meili_data:/meili_data

volumes:
  sqlserver_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  meili_data:

