<div class="reader-page" *ngIf="chapter && !isLoading">
  <!-- Reader Control Header -->
  <div class="reader-header bg-glass">
    <div class="container header-container">
      <div class="comic-info">
        <a [routerLink]="['/comic', chapter.comicSlug]" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
        <h2>{{ chapter.comicTitle }}</h2>
        <span class="chapter-number">Chapter {{ chapter.chapterNumber }}</span>
      </div>

      <div class="chapter-controls">
        <button [disabled]="!prevChapterId" [routerLink]="prevChapterId ? ['/read', prevChapterId] : null" class="btn btn-secondary btn-sm">
          <i class="fa-solid fa-chevron-left"></i> Chap Trước
        </button>

        <select [(ngModel)]="selectedChapterId" (change)="onSelectChapter()" class="chapter-select">
          <option *ngFor="let ch of chapter.allChapters" [value]="ch.id">
            Chapter {{ ch.chapterNumber }}: {{ ch.title }}
          </option>
        </select>

        <button [disabled]="!nextChapterId" [routerLink]="nextChapterId ? ['/read', nextChapterId] : null" class="btn btn-secondary btn-sm">
          Chap Sau <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Keyboard Shortcuts Hint Bar -->
  <div class="container shortcut-hint">
    <span><i class="fa-regular fa-keyboard text-primary"></i> Mẹo: Dùng phím <kbd>←</kbd> và <kbd>→</kbd> trên bàn phím để chuyển chương nhanh.</span>
  </div>

  <!-- Vertical Manga Reader Gallery -->
  <div class="reader-gallery">
    <div class="page-item" *ngFor="let page of chapter.pages">
      <img [src]="page.imageUrl" [alt]="'Trang ' + page.pageNumber" loading="lazy" />
      <span class="page-num">{{ page.pageNumber }} / {{ chapter.pages.length }}</span>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="container bottom-nav">
    <button [disabled]="!prevChapterId" [routerLink]="prevChapterId ? ['/read', prevChapterId] : null" class="btn btn-secondary">
      <i class="fa-solid fa-chevron-left"></i> Chap Trước
    </button>
    <button [disabled]="!nextChapterId" [routerLink]="nextChapterId ? ['/read', nextChapterId] : null" class="btn btn-primary">
      Chap Sau <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

  <!-- Floating Scroll To Top Button -->
  <button class="btn-float-top" *ngIf="showScrollTop" (click)="scrollToTop()" title="Về đầu trang">
    <i class="fa-solid fa-arrow-up"></i>
  </button>
</div>
