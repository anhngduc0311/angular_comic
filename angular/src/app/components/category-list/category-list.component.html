<div class="container category-page">
  <div class="page-header">
    <h1><i class="fa-solid fa-tags text-gradient"></i> Danh Sách Thể Loại</h1>
    <p>Khám phá các thể loại truyện tranh phong phú tại MangaFlux.</p>
  </div>

  <div class="category-grid" *ngIf="!isLoading; else catSkeleton">
    <a *ngFor="let cat of categories" [routerLink]="['/comics']" [queryParams]="{ category: cat.slug }" class="category-card card-hover bg-glass">
      <div class="cat-header">
        <h3>{{ cat.name }}</h3>
        <span class="count badge badge-primary">{{ cat.comicCount }} truyện</span>
      </div>
      <p class="desc">{{ cat.description || 'Truyện thuộc thể loại ' + cat.name + ' chọn lọc hấp dẫn.' }}</p>
      <div class="cat-footer">
        <span>Xem tất cả <i class="fa-solid fa-arrow-right"></i></span>
      </div>
    </a>
  </div>

  <ng-template #catSkeleton>
    <div class="category-grid">
      <div class="category-card bg-glass" *ngFor="let _ of skeletonCategories" style="padding: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <div class="skeleton skeleton-title" style="width: 50%; height: 1.4rem; margin-bottom: 0;"></div>
          <div class="skeleton" style="width: 70px; height: 1.4rem; border-radius: 4px;"></div>
        </div>
        <div class="skeleton skeleton-text" style="width: 90%;"></div>
        <div class="skeleton skeleton-text" style="width: 60%;"></div>
      </div>
    </div>
  </ng-template>
</div>
