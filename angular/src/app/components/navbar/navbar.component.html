<header class="navbar bg-glass">
  <div class="container nav-container">
    <!-- Brand Logo -->
    <a routerLink="/" (click)="closeMobileMenu()" class="brand-logo">
      <i class="fa-solid fa-bolt logo-icon"></i>
      <span class="logo-text">Manga<span class="text-gradient">Flux</span></span>
    </a>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle Navigation">
      <i class="fa-solid" [class.fa-bars]="!isMobileMenuOpen" [class.fa-xmark]="isMobileMenuOpen"></i>
    </button>

    <!-- Navigation Links & Search Wrapper -->
    <div class="nav-content" [class.open]="isMobileMenuOpen">
      <nav class="nav-links">
        <a routerLink="/" (click)="closeMobileMenu()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Trang chủ</a>
        <a routerLink="/comics" (click)="closeMobileMenu()" routerLinkActive="active">Danh sách truyện</a>
        <a routerLink="/categories" (click)="closeMobileMenu()" routerLinkActive="active">Thể loại</a>
        <a routerLink="/followed" (click)="closeMobileMenu()" routerLinkActive="active" *ngIf="authService.isLoggedIn">Theo dõi</a>
        <a routerLink="/history" (click)="closeMobileMenu()" routerLinkActive="active" *ngIf="authService.isLoggedIn">Lịch sử</a>
        <a routerLink="/profile" (click)="closeMobileMenu()" routerLinkActive="active" *ngIf="authService.isLoggedIn">Trang cá nhân</a>
        <a routerLink="/admin" (click)="closeMobileMenu()" routerLinkActive="active" *ngIf="authService.isAdmin" class="admin-badge">Admin</a>
      </nav>

      <!-- Search Form -->
      <form (ngSubmit)="onSearch()" class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" [(ngModel)]="searchQuery" name="search" placeholder="Tìm kiếm..." />
      </form>

      <!-- User Auth Actions -->
      <div class="user-actions">
        <ng-container *ngIf="!authService.isLoggedIn">
          <a routerLink="/auth" (click)="closeMobileMenu()" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
          </a>
        </ng-container>

        <ng-container *ngIf="authService.isLoggedIn">
          <a routerLink="/notifications" (click)="closeMobileMenu()" class="nav-icon-btn" title="Thông báo">
            <i class="fa-solid fa-bell"></i>
            <ng-container *ngIf="(notificationService.unreadCount$ | async) as count">
              <span class="notification-badge" *ngIf="count > 0">
                {{ count > 99 ? '99+' : count }}
              </span>
            </ng-container>
          </a>

          <div class="user-profile">
            <a routerLink="/profile" (click)="closeMobileMenu()" class="profile-link" title="Trang cá nhân">
              <img [src]="authService.currentUserValue?.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80'" alt="Avatar" class="avatar" />
              <span class="username">{{ authService.currentUserValue?.fullName || authService.currentUserValue?.username }}</span>
            </a>
            <button (click)="logout()" class="btn-logout" title="Đăng xuất">
              <i class="fa-solid fa-power-off"></i>
            </button>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</header>
