<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradient for Orange Book / Wings -->
    <linearGradient id="tkOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e33" />
      <stop offset="50%" stop-color="#fd5400" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Gradient for Cyan/Blue Komi K -->
    <linearGradient id="tkCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="tkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fd5400" flood-opacity="0.35" />
    </filter>

    <!-- Sparkle Glow Filter -->
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== EMBLEM / ICON (LEFT: X=10, Y=10, 80x80) ==================== -->
  <g transform="translate(10, 10)" filter="url(#tkShadow)">
    <!-- Outer Glow / Background Container -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#18181b" />
    <rect x="0" y="0" width="80" height="80" rx="18" fill="none" stroke="url(#tkOrangeGrad)" stroke-width="2" stroke-opacity="0.6" />

    <!-- Comic Spine & Base Curve -->
    <path d="M 22 62 Q 40 68 58 62" stroke="#fd5400" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Left Manga Page with Comic Panels -->
    <path d="M 40 22 L 22 26 C 20 27 18 29 18 32 L 18 56 C 18 58 20 60 22 60 L 40 55 Z" 
          fill="#27272a" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Comic Panel Frames (Inside Left Page) -->
    <rect x="22" y="30" width="7" height="9" rx="1.5" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <rect x="31" y="30" width="6" height="9" rx="1.5" fill="#fd5400" fill-opacity="0.3" stroke="#fd5400" stroke-width="1" />
    <rect x="22" y="41" width="15" height="9" rx="1.5" fill="#fd5400" fill-opacity="0.2" stroke="#fd5400" stroke-width="1" />

    <!-- Right Page: Dynamic Stylized 'K' & Wing Accent -->
    <path d="M 40 22 L 58 26 C 60 27 62 29 62 32 L 62 56 C 62 58 60 60 58 60 L 40 55 Z" 
          fill="#27272a" stroke="#fd5400" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Stylized Letter 'K' inside Right Page -->
    <path d="M 46 28 L 46 51 M 56 31 L 46 41 L 57 50" 
          stroke="url(#tkCyanGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Left Wing Feathers (Orange Glow) -->
    <path d="M 16 35 C 10 33 6 27 8 20 C 13 25 16 29 16 35 Z" fill="url(#tkOrangeGrad)" />
    <path d="M 15 44 C 8 43 4 39 6 33 C 10 36 14 39 15 44 Z" fill="url(#tkOrangeGrad)" />

    <!-- Right Wing Feathers (Cyan Glow) -->
    <path d="M 64 35 C 70 33 74 27 72 20 C 67 25 64 29 64 35 Z" fill="url(#tkCyanGrad)" />
    <path d="M 65 44 C 72 43 76 39 74 33 C 70 36 66 39 65 44 Z" fill="url(#tkCyanGrad)" />

    <!-- Anime Sparkles / Stars -->
    <g filter="url(#sparkleGlow)">
      <!-- Top Center Sparkle -->
      <path d="M 40 10 L 41.5 14 L 45.5 15.5 L 41.5 17 L 40 21 L 38.5 17 L 34.5 15.5 L 38.5 14 Z" fill="#ffedd5" />
      <!-- Top Left Mini Sparkle -->
      <path d="M 12 18 L 13 20.5 L 15.5 21.5 L 13 22.5 L 12 25 L 11 22.5 L 8.5 21.5 L 11 20.5 Z" fill="#38bdf8" />
      <!-- Top Right Mini Sparkle -->
      <path d="M 68 18 L 69 20.5 L 71.5 21.5 L 69 22.5 L 68 25 L 67 22.5 L 64.5 21.5 L 67 20.5 Z" fill="#fd5400" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY (RIGHT: X=102) ==================== -->
  <g transform="translate(102, 12)">
    <!-- Brand Title Text: TruyenKomi (No .com) -->
    <text x="0" y="47" font-family="'Quicksand', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      <tspan fill="url(#tkOrangeGrad)">Truyen</tspan><tspan fill="url(#tkCyanGrad)">Komi</tspan>
    </text>

    <!-- Subtitle Badge / Tagline -->
    <g transform="translate(2, 55)">
      <!-- Mini Pill Background -->
      <rect x="0" y="0" width="180" height="19" rx="5.5" fill="#fd5400" fill-opacity="0.12" />
      <text x="8" y="13.5" font-family="'Quicksand', 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#fd5400">
        MANGA • MANHWA • MANHUA
      </text>
    </g>
  </g>
</svg>
