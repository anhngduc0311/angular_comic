<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tkIconOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e33" />
      <stop offset="50%" stop-color="#fd5400" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="tkIconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <filter id="tkIconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#fd5400" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#18181b" />
  <rect x="5" y="5" width="90" height="90" rx="22" fill="none" stroke="url(#tkIconOrange)" stroke-width="2.5" stroke-opacity="0.7" />

  <g transform="translate(10, 10)">
    <!-- Comic Spine & Base Curve -->
    <path d="M 22 62 Q 40 68 58 62" stroke="#fd5400" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Left Manga Page with Comic Panels -->
    <path d="M 40 22 L 22 26 C 20 27 18 29 18 32 L 18 56 C 18 58 20 60 22 60 L 40 55 Z" 
          fill="#27272a" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Comic Panel Frames -->
    <rect x="22" y="30" width="7" height="9" rx="1.5" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <rect x="31" y="30" width="6" height="9" rx="1.5" fill="#fd5400" fill-opacity="0.3" stroke="#fd5400" stroke-width="1" />
    <rect x="22" y="41" width="15" height="9" rx="1.5" fill="#fd5400" fill-opacity="0.2" stroke="#fd5400" stroke-width="1" />

    <!-- Right Page: Dynamic Stylized 'K' -->
    <path d="M 40 22 L 58 26 C 60 27 62 29 62 32 L 62 56 C 62 58 60 60 58 60 L 40 55 Z" 
          fill="#27272a" stroke="#fd5400" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Stylized Letter 'K' -->
    <path d="M 46 28 L 46 51 M 56 31 L 46 41 L 57 50" 
          stroke="url(#tkIconCyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Left Wing Feathers -->
    <path d="M 16 35 C 10 33 6 27 8 20 C 13 25 16 29 16 35 Z" fill="url(#tkIconOrange)" />
    <path d="M 15 44 C 8 43 4 39 6 33 C 10 36 14 39 15 44 Z" fill="url(#tkIconOrange)" />

    <!-- Right Wing Feathers -->
    <path d="M 64 35 C 70 33 74 27 72 20 C 67 25 64 29 64 35 Z" fill="url(#tkIconCyan)" />
    <path d="M 65 44 C 72 43 76 39 74 33 C 70 36 66 39 65 44 Z" fill="url(#tkIconCyan)" />

    <!-- Sparkles -->
    <path d="M 40 10 L 41.5 14 L 45.5 15.5 L 41.5 17 L 40 21 L 38.5 17 L 34.5 15.5 L 38.5 14 Z" fill="#ffedd5" />
    <path d="M 12 18 L 13 20.5 L 15.5 21.5 L 13 22.5 L 12 25 L 11 22.5 L 8.5 21.5 L 11 20.5 Z" fill="#38bdf8" />
    <path d="M 68 18 L 69 20.5 L 71.5 21.5 L 69 22.5 L 68 25 L 67 22.5 L 64.5 21.5 L 67 20.5 Z" fill="#fd5400" />
  </g>
</svg>
